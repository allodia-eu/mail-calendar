# The sign-in server's HTTPS front: `stalwart-oauth` as a provider on the open internet would
# present itself to a mail client, for an IMAP account (docs/mail-oauth.md rule 4).
#
# An IMAP account learns its authorization server from HTTPS only: the `<issuer>` of the
# provider's own autoconfig, or RFC 8414 metadata at a domain's well-known location. The sign-in
# server publishes `http://localhost:28081`, which neither channel may name, so this front
# republishes its metadata under an HTTPS issuer and leaves every endpoint on the server itself.
# The browser therefore only ever visits `http://localhost:28081`, which needs no certificate
# trusted anywhere; only the core's own fetches reach this front, and a debug build trusts its
# certificate through MAILCAL_EXTRA_CA like the harness's IMAP listeners.
#
# Two names, deliberately different, because each is an issuer candidate for a different server:
#
#   https://localhost    the server's own host name, where a provider serves its calendars and
#                        contacts: the autoconfig for `alice@localhost`, and CalDAV and CardDAV
#                        with their RFC 9728 metadata. Never authorization-server metadata: the
#                        seeded server is dialled as `localhost:12993`, a mail server's own host
#                        is one of the places setup looks for an authorization server, and
#                        metadata here would offer the seeded server a sign-in whose token it
#                        refuses.
#   https://127.0.0.1    the authorization-server metadata. Only an autoconfig naming it, or an
#                        address typed at `127.0.0.1`, ever asks for it.
#
# The issuer is rewritten in each metadata body, so `authorization_response_iss_parameter_supported`
# is withdrawn with it: the redirect still carries the server's own `iss`, which is not the issuer
# republished here, and the strict RFC 9207 check (rule 11) would refuse every sign-in. The check
# itself is covered by the offline suite. The rewrites match Stalwart's compact JSON exactly; a
# Stalwart bump that reformats it shows up as an issuer mismatch in `live_imap_oauth`.
#
# What is left as the server publishes it is `protected_resources`: its HTTPS origins and its host
# name bare, all `localhost`. So the issuer's tokens may go to IMAP and SMTP on `localhost` and to
# `https://localhost`, which is why the calendars live there, and to nothing on `127.0.0.1`.

server {
    listen 443 ssl default_server;
    server_name localhost;
    ssl_certificate /etc/nginx/harness-tls/front.pem;
    ssl_certificate_key /etc/nginx/harness-tls/front.key;

    location = /.well-known/autoconfig/mail/config-v1.1.xml {
        default_type application/xml;
        alias /usr/share/harness/autoconfig.xml;
    }

    # The sign-in server's calendars and contacts. Stalwart writes the challenge's
    # `resource_metadata` and the metadata's `resource` from the request's host, so the front
    # passes the one the client asked for; its redirects are relative.
    location ~ ^/(dav/|\.well-known/caldav|\.well-known/carddav) {
        proxy_pass http://stalwart-oauth:8080;
        proxy_set_header Host localhost;
    }

    # Their RFC 9728 metadata, naming the issuer this front publishes rather than the one the
    # server was configured with, as the authorization-server metadata below does.
    location ^~ /.well-known/oauth-protected-resource {
        proxy_pass http://stalwart-oauth:8080;
        proxy_set_header Host localhost;
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"authorization_servers":["http://localhost:28081"]' '"authorization_servers":["https://127.0.0.1"]';
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    # The healthcheck's plaintext listener, inside the container only: it proves the rewrite, not
    # merely that nginx started.
    listen 8081;
    server_name 127.0.0.1;
    ssl_certificate /etc/nginx/harness-tls/front.pem;
    ssl_certificate_key /etc/nginx/harness-tls/front.key;

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://stalwart-oauth:8080;
        # sub_filter reads only an uncompressed body.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/json;
        sub_filter_once off;
        # The issuer `stalwart-oauth`'s STALWART_PUBLIC_URL makes it publish; change them together.
        sub_filter '"issuer":"http://localhost:28081"' '"issuer":"https://127.0.0.1"';
        sub_filter '"authorization_response_iss_parameter_supported":true' '"authorization_response_iss_parameter_supported":false';
    }

    location / {
        return 404;
    }
}

# The seeded server's CalDAV and CardDAV over HTTPS, under a certificate no debug build trusts
# (`harness.sh certs` reads 12993, 12995 and 443, never this one): the server a person sets a
# calendar up against and is asked whether to accept the certificate of
# (docs/certificate-exceptions.md). Stalwart answers with relative redirects and paths, so nothing
# is rewritten.
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/harness-tls/untrusted.pem;
    ssl_certificate_key /etc/nginx/harness-tls/untrusted.key;

    location / {
        proxy_pass http://stalwart:8080;
    }
}
