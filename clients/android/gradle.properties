android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Skip Gradle's configuration phase on unchanged builds (validated: stores + reuses cleanly on
# Gradle 9.7 / AGP 9.3). Complements the build cache above.
org.gradle.configuration-cache=true
# A Gradle deprecation fails the build, as a compiler warning does (app/build.gradle.kts), so the
# change that introduces one is the change that deals with it.
org.gradle.warning.mode=fail

# AGP 9 built-in Kotlin + new DSL (see build.gradle.kts). These two must move together: the
# standalone org.jetbrains.kotlin.android plugin can't load under newDsl.
android.builtInKotlin=true
android.newDsl=true

# No AGP-9 opt-outs. The R8 (strict keep-rule full-mode, optimised resource shrinking) and
# compile-time-R-class defaults are validated by a signed release build (R8 + shrinking + the JNA
# keep rules in proguard-rules.pro) plus a launch smoke test of the shrunk APK on the emulator.
# Dependency constraints (android.dependency.useConstraints) stay off as well: the resolved compile,
# runtime and unit-test classpaths are identical without them, and turning them on makes AGP warn
# at every configuration, through a companion option that is itself deprecated.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
