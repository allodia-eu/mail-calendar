android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Skip Gradle's configuration phase on unchanged builds (validated: stores + reuses cleanly on
# Gradle 9.7 / AGP 9.3). Complements the build cache above.
org.gradle.configuration-cache=true

# AGP 9 built-in Kotlin + new DSL (see build.gradle.kts). These two must move together: the
# standalone org.jetbrains.kotlin.android plugin can't load under newDsl.
android.builtInKotlin=true
android.newDsl=true

# One AGP-9 opt-out remains: dependency-constraint publishing preserves the pre-9 resolution
# behavior. It's not exercised by any gate here, so it stays until there's a reason to revisit.
# The R8 (strict keep-rule full-mode, optimized resource shrinking) and compile-time-R-class
# opt-outs the Upgrade Assistant left were dropped, the AGP-9 defaults are validated by a signed
# release build (R8 + shrinking + the JNA keep rules in proguard-rules.pro) plus a launch smoke
# test of the shrunk APK on the emulator.
android.dependency.useConstraints=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
