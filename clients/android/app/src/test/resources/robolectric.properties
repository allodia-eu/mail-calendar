# Robolectric emulates one SDK level for the whole suite. Pinned rather than inherited from
# targetSdk (36) so a compileSdk/targetSdk bump can't silently outrun the Robolectric release that
# has an image for it, the bump then fails here, deliberately, instead of everywhere at once.
sdk=35
# MailcalApplication.onCreate opens the rotating file log, registers lifecycle callbacks and
# enqueues the WorkManager sync, none of which a unit test wants. Host the tests in a bare
# Application instead.
application=android.app.Application
