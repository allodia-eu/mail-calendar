[package]
name = "mailcal-linux"
description = "GTK4/libadwaita Linux client for Allodia Mail & Calendar."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
dev-harness = ["mailcal-bindings/dev-harness"]
# Passthrough for the core's Allodia sign-in, so the Settings card has something to draw. Off by
# default, like the core's own: the code it turns on is source-available rather than GPL and the
# open tree must build without it (BUILDING.md). build-and-run.sh derives it from the injected
# registration, so the two halves cannot disagree.
allodia-license = ["mailcal-bindings/allodia-license"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_5"] }
ashpd = { version = "0.13.13", features = ["notification"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["gnome_46"] }
jiff = "0.2.29"
# The client logs through the facade the core emits on: `mailcal-bindings` registers a
# process-global `log` bridge onto the injected host `Logger`, so a `log::error!` here reaches the
# same diagnostic file without a second sink threaded through boot (docs/logging.md).
log.workspace = true
mailcal-bindings = { path = "../../crates/mailcal-bindings" }
oo7 = "0.6.0"
relm4 = { version = "0.11.0", default-features = false, features = ["gnome_46", "libadwaita", "macros"] }
serde.workspace = true
serde_json.workspace = true
sys-locale = "0.3.2"
time = { workspace = true, features = ["formatting", "local-offset"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
url.workspace = true
webkit6 = "0.6.1"

[build-dependencies]
mailcal-l10n = { path = "../../crates/mailcal-l10n" }

[lints]
workspace = true
