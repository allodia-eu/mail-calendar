    * {

    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--surface);
      color: var(--text);

       zooms the whole page in when an editable or a `select` takes focus: its "make the field
       readable" behaviour, which a page cannot decline except by locking `maximum-scale`, and

    body {

      flex-direction: column;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: #f6f8fa;
    }

    button,
    select {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control);
      color: var(--text);
      font: inherit;

    button {
      min-width: 32px;
      padding: 0 9px;
    }

    button:active,
    select:focus,

      align-self: stretch;
      margin: 2px 2px;
      background: var(--border);

    .toolbar svg {
      display: block;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;

    /* The colour buttons show the colour they will apply as a bar under the glyph, so the control
       says what it does without opening it. */

      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0 8px;
      line-height: 1;

      width: 16px;
      height: 3px;
      border-radius: 1px;
      background: var(--text);

      display: flex;
    }

      left: 0;
      min-width: 168px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--control);
      box-shadow: 0 6px 18px rgba(21, 35, 48, 0.16);

      top: auto;
      bottom: calc(100% + 4px);
    }

    /* Keep a popover inside the viewport when its button sits near the right edge. */

      left: auto;
      right: 0;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(6, 22px);
      gap: 4px;
    }

    .swatches button {
      width: 22px;
      height: 22px;
      min-width: 0;
      padding: 0;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    .popover .reset {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 0 8px;
      text-align: left;
      white-space: nowrap;
    }

    /* The insert-table size picker: hovering the grid previews the size, clicking commits it. */
    .grid-picker {
      display: grid;
      grid-template-columns: repeat(8, 16px);
      gap: 2px;
    }

    .grid-picker span {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--control);
    }

    .grid-picker span.on {
      border-color: var(--active);
      background: color-mix(in srgb, var(--active) 18%, #ffffff);
    }

    .grid-size {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-items button {
      min-height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }

    .menu-items button:hover:not(:disabled) {
      background: color-mix(in srgb, var(--active) 10%, transparent);
    }

    .menu-items button:disabled {
      color: var(--muted);
      opacity: 0.6;
    }

    .menu-items hr {
      margin: 4px 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    .editor {
      flex: 1;
      min-height: 180px;
      padding: 14px;
      overflow: auto;
      background: #ffffff;
      outline: none;
      word-break: break-word;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
    }

    /* Native-chrome mode (Android): the native surface owns a single scroll; the compose
       header sits in a native overlay above this WebView and scrolls away as the message
       grows, and the toolbar pins just above the keyboard. So here the *page* scrolls (not an
       inner editor box), the toolbar is fixed to the viewport bottom, and the editor reserves
       room for the native header (top) and the fixed toolbar (bottom) via insets the host sets.
       Untouched hosts (macOS/Windows) keep the flex/inner-scroll layout above. */
    html.native-chrome,
    body.native-chrome {
      height: auto;
    }

    /* Keep the caret clear of the fixed toolbar: reserve the toolbar's height at the bottom when
       the browser scrolls the caret into view, so a newly typed line lands above it, not behind. */
    html.native-chrome {
      scroll-padding-bottom: var(--composer-bottom-inset, 56px);
    }

    body.native-chrome {
      display: block;
      min-height: 100%;
    }

    body.native-chrome .toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      border-top: 1px solid var(--border);
      border-bottom: none;
    }

    body.native-chrome .editor {
      flex: none;
      overflow: visible;
      box-sizing: border-box;
      /* Filling the viewport when empty; so tapping anywhere focuses the body; is done in JS
         (`fillViewport`), NOT here. Viewport-percentage units are dead in this WebView: it is laid
         out after the page loads, so its layout viewport is fixed at zero height and both
         `100vh` and `100%` compute to `0px` with no warning. Do not "simplify" this back to

    }

    p {
      margin: 0 0 10px;
    }

    ul,
    ol {
      margin: 0 0 10px 22px;
      padding: 0;
    }

    /* A sub-list is inside its parent <li>, so it must not repeat the outer block's bottom margin,
       that would open a gap between an indented item and the one after it. */
    li > ul,
    li > ol {
      margin-bottom: 0;
    }

    table {
      width: 100%;
      margin: 0 0 10px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td,
    th {
      min-width: 48px;
      min-height: 28px;
      padding: 6px;
      border: 1px solid var(--border);
      vertical-align: top;
    }

    /* Constrain every image to the editor width and keep its aspect ratio: editor-inserted
       attachments (which carry data-attachment-id) AND the inline images carried in a quoted
       reply/forward (raw <img src="data:…"> with no data-attachment-id). Without this, a
       quoted signature logo renders at its intrinsic size and overflows the editor. The
       `height: auto !important` keeps a quoted image whose original CSS/inline style pinned
       its height from being squashed when the width is capped; mirrors the reading view's
       BASE_CSS (docs/rendering-security.md). */
    img {
      max-width: 100%;
      height: auto !important;
    }

    /* The quoted original on reply/forward. The attribution is display-only; the body stays
       editable so the user can trim it. The two styles mirror the Rust composer renderer
       (mailcal-composer): Indented puts the body in a left border, LineAndHeader divides it
       off with a rule and shows a labeled header block. The two tokens are the Rust
       QuoteStyle variant names, which serialize verbatim into the seed JSON. */
    .allodia-quote {
      margin: 14px 0 0;
    }

    .allodia-quote[data-quote-style="LineAndHeader"] {
      border-top: 1pt solid rgb(181, 196, 223);
      padding-top: 3pt;
    }

    .aq-attr {
      color: var(--muted);
      margin: 0 0 8px;
      white-space: pre-wrap;
    }

    /* A plain-text original keeps the line breaks its sender wrote. It is inserted with
       `textContent`, so there are no <br>s to lay it out: without this the whole message
       collapses onto one line. */
    .aq-body.aq-plain {
      white-space: pre-wrap;
    }

    .allodia-quote[data-quote-style="Indented"] .aq-body {
      margin: 0 0 0 0.8ex;
      padding-left: 1ex;
      border-left: 2px solid #cccccc;
    }

    /* The sender's signature. Editable like any other body content (Outlook's model: seeded,
       then yours to trim before sending) and given no decoration of its own; whatever the user
       authored in Settings is exactly what they should see here, and what goes out. The margin
       is the only editor-side addition, so the seeded block doesn't butt against the line above
       it; the Rust renderer emits the same wrapper class with no styling at all. */
    .allodia-signature {
      margin: 14px 0 0;
    }
  </style>
</head>
<body>

        </span>

  <main id="editor" class="editor" contenteditable="true" data-placeholder="Write your message" aria-label="Write your message"></main>

      endOffset: range.endOffset

    if (!selection)

    try {
      range.setStart(saved.startNode, saved.startOffset);
      range.setEnd(saved.endNode, saved.endOffset);

      return true;

  // src/attachments.ts
  class Attachments {
    items = [];
    captured = 0;

      if (index >= 0)

        blob: String(meta.blob),
        file_name: String(meta.file_name),

        id: String(meta.id),
        blob: String(meta.blob),
        file_name: String(meta.file_name),
        media_type: String(meta.media_type),
        size: meta.size == null ? null : Number(meta.size),
        disposition: { Inline: { cid: String(meta.cid) } }

        id,
        file_name: meta.file_name || `image-${seq}${extensionFor(meta.media_type)}`,
        media_type: meta.media_type || mediaTypeOf(meta.data_url) || "image/png",
        size: null,
        disposition: { Inline: { cid: mintContentId(seq) } },
        data_url: meta.data_url

  function mintContentId(seq) {
    return `img${seq}.${Date.now()}@allodia.local`;
  }
  function mediaTypeOf(dataUrl) {
    const head = dataUrl.slice(0, dataUrl.indexOf(","));
    return head.startsWith("data:") ? head.slice("data:".length).split(";")[0] ?? "" : "";
  }
  function extensionFor(mediaType) {
    const subtype = mediaType.split("/")[1] ?? "";

    if (subtype === "svg+xml")

    return /^[a-z0-9]+$/.test(subtype) ? `.${subtype}` : ".img";

  function safePreviewUrl(url) {
    return typeof url === "string" && (url.startsWith("data:image/") || url.startsWith("blob:")) ? url : "";
  }
  function insertAtCaret(editor, node) {
    const selection = documentOf(editor).defaultView?.getSelection();
    if (!selection || selection.rangeCount === 0 || !editor.contains(selection.getRangeAt(0).startContainer)) {
      editor.appendChild(node);
      return;
    }
    const range = selection.getRangeAt(0);
    range.deleteContents();
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    selection.removeAllRanges();
    selection.addRange(range);
  }

  // src/autoformat.ts
  var MARKER = "-";
  var BLOCK_TAGS = new Set(["DIV", "P", "UL", "OL", "TABLE", "BLOCKQUOTE", "SECTION", "ARTICLE"]);
  var REGION_CLASSES = ["allodia-quote", "aq-attr", "aq-body", "allodia-signature"];
  function autoformatBulletList(editor) {

    before.setEnd(range.startContainer, range.startOffset);

      italic: false,
      underline: false,
      size: null,
      color: null,
      highlight: null

    Normal: 15,
    Large: 18,

    editor.textContent = "";
    for (const line of String(text ?? "").split(`
`)) {
      const div = doc.createElement("div");
      if (line.length > 0)
        div.textContent = line;
      else
        div.appendChild(doc.createElement("br"));
      editor.appendChild(div);
    }
  }

  // src/tables.ts
  function cellsOf(row) {
    return Array.from(row.children).filter((cell) => cell.tagName === "TD" || cell.tagName === "TH");
  }
  function newCell(doc) {
    const cell = doc.createElement("td");
    cell.appendChild(doc.createElement("br"));
    return cell;
  }
  function cellAtCaret(editor) {
    return ancestorAtCaret(editor, "td", "th");
  }
  function tableOf(cell, editor) {
    return ancestorOf(cell.parentElement, editor, "table");
  }
  function outermostList(li, editor) {
    let found = null;
    for (let node = li;node && node !== editor; node = node.parentElement) {
      if (node.tagName === "UL" || node.tagName === "OL")

    }
    return found;
  }
  function locate(cell, editor) {
    const table = tableOf(cell, editor);
    if (!table)
      return null;
    const rows = tableRows(table);
    const row = cell.parentElement;
    if (!row)
      return null;
    const rowIndex = rows.indexOf(row);
    const columnIndex = cellsOf(row).indexOf(cell);
    if (rowIndex < 0 || columnIndex < 0)

  }
  function insertTable(editor, rows, columns) {
    const doc = documentOf(editor);
    const rowCount = Math.max(1, Math.floor(rows));
    const columnCount = Math.max(1, Math.floor(columns));
    const table = doc.createElement("table");
    const body = doc.createElement("tbody");
    for (let r = 0;r < rowCount; r += 1) {
      const row = doc.createElement("tr");
      for (let c = 0;c < columnCount; c += 1)
        row.appendChild(newCell(doc));
      body.appendChild(row);
    }
    table.appendChild(body);
    const trailing = emptyLine(doc);
    const range = rangeWithin(editor);
    const cell = range ? ancestorOf(range.startContainer, editor, "td", "th") : null;
    const enclosing = cell ? ancestorOf(cell, editor, "table") : null;
    const block = range && !cell ? ancestorOf(range.startContainer, editor, "p", "div", "li") : null;
    if (enclosing?.parentElement) {
      enclosing.parentElement.insertBefore(table, enclosing.nextSibling);
      table.parentElement?.insertBefore(trailing, table.nextSibling);

      block.replaceWith(table);
      table.parentElement?.insertBefore(trailing, table.nextSibling);
    } else if (block && block.parentElement) {
      const anchor = block.tagName === "LI" ? outermostList(block, editor) ?? block : block;
      anchor.parentElement?.insertBefore(table, anchor.nextSibling);
      table.parentElement?.insertBefore(trailing, table.nextSibling);

      editor.appendChild(trailing);

  }
  function insertRow(editor, cell, below) {
    const at = locate(cell, editor);
    if (!at)
      return false;
    const doc = documentOf(cell);
    const width = cellsOf(at.row).length;
    const row = doc.createElement("tr");
    for (let c = 0;c < width; c += 1)
      row.appendChild(newCell(doc));
    at.row.parentElement?.insertBefore(row, below ? at.row.nextSibling : at.row);
    caretInto(row.firstElementChild ?? row);
    return true;
  }
  function insertColumn(editor, cell, after) {
    const at = locate(cell, editor);
    if (!at)
      return false;
    const doc = documentOf(cell);
    let focus = null;
    for (const row of at.rows) {
      const cells = cellsOf(row);
      const fresh = newCell(doc);
      const anchor = cells[at.columnIndex];
      if (anchor)
        row.insertBefore(fresh, after ? anchor.nextSibling : anchor);
      else
        row.appendChild(fresh);
      if (row === at.row)
        focus = fresh;
    }
    if (focus)
      caretInto(focus);
    return true;
  }
  function deleteRow(editor, cell) {
    const at = locate(cell, editor);
    if (!at)
      return false;
    if (at.rows.length <= 1)
      return deleteTable(editor, cell);
    const fallback = at.rows[at.rowIndex + 1] ?? at.rows[at.rowIndex - 1];
    at.row.remove();
    const next = fallback ? cellsOf(fallback)[at.columnIndex] ?? cellsOf(fallback)[0] : null;
    if (next)
      caretInto(next);
    return true;
  }
  function deleteColumn(editor, cell) {
    const at = locate(cell, editor);
    if (!at)
      return false;
    if (cellsOf(at.row).length <= 1)
      return deleteTable(editor, cell);
    let focus = null;
    for (const row of at.rows) {
      const cells = cellsOf(row);
      const doomed = cells[at.columnIndex];
      const survivor = cells[at.columnIndex + 1] ?? cells[at.columnIndex - 1] ?? null;
      if (row === at.row)
        focus = survivor;
      doomed?.remove();
    }
    if (focus)
      caretInto(focus);
    return true;
  }
  function deleteTable(editor, cell) {
    const table = tableOf(cell, editor);
    if (!table)
      return false;
    const paragraph = emptyLine(documentOf(table));
    table.replaceWith(paragraph);
    caretInto(paragraph);
    return true;
  }
  function moveToAdjacentCell(editor, back) {
    const cell = cellAtCaret(editor);
    if (!cell)
      return false;
    const table = tableOf(cell, editor);
    if (!table)
      return false;
    const cells = tableRows(table).flatMap((row) => cellsOf(row));
    const next = cells[cells.indexOf(cell) + (back ? -1 : 1)];
    if (!next)
      return false;
    caretInto(next);
    return true;
  }

  // src/toolbar.ts
  var TEXT_COLOURS = [
    "#000000",
    "#7f7f7f",
    "#c00000",
    "#ff0000",
    "#ffc000",
    "#ffff00",
    "#92d050",
    "#00b050",
    "#00b0f0",
    "#0070c0",
    "#002060",
    "#7030a0"
  ];
  var HIGHLIGHTS = ["#ffff00", "#92d050", "#00ffff", "#ff99cc", "#ffc000", "#c0c0c0"];
  var PICKER_ROWS = 6;
  var PICKER_COLUMNS = 8;
  function installToolbar(editor, root, labels) {
    const doc = documentOf(root);
    const byId = (id) => {
      const node = doc.getElementById(id);
      if (!node)
        throw new Error(`editor markup is missing #${id}`);
      return node;
    };
    root.addEventListener("mousedown", (event) => {
      const target = event.target;
      if (!target?.closest?.("select"))
        event.preventDefault();
    });
    for (const button of Array.from(root.querySelectorAll("[data-command]"))) {
      button.addEventListener("click", () => {
        const command = button.dataset.command;
        if (command === "bold" || command === "italic" || command === "underline") {
          applyMark(editor, command);
        }
      });
    }
    const fontSize = byId("font-size");
    fontSize.addEventListener("change", () => {
      if (isFontSize(fontSize.value))
        applyFontSize(editor, fontSize.value);
    });
    byId("bullet-list").addEventListener("click", () => legacy(editor, "insertUnorderedList"));
    byId("ordered-list").addEventListener("click", () => legacy(editor, "insertOrderedList"));
    byId("indent").addEventListener("click", () => indentSelection(editor, false));
    byId("outdent").addEventListener("click", () => indentSelection(editor, true));
    const alignPopover = (popover) => {
      popover.panel.classList.remove("align-end");
      const view = windowOf(editor);
      const width = view.innerWidth;
      const wasHidden = popover.panel.hidden;
      popover.panel.hidden = false;
      const button = popover.button.getBoundingClientRect();
      const panel = popover.panel.getBoundingClientRect();
      popover.panel.hidden = wasHidden;
      if (width > 0 && panel.width > 0 && button.left + panel.width > width) {
        popover.panel.classList.add("align-end");
      }
    };
    const popovers = [];
    const closeAll = (except) => {
      for (const popover of popovers) {
        if (popover === except)
          continue;
        popover.panel.hidden = true;
        popover.button.setAttribute("aria-expanded", "false");
      }
    };
    const register = (buttonId, panelId, build) => {
      const popover = {
        button: byId(buttonId),
        panel: byId(panelId),
        build: () => build(byId(panelId))
      };
      popovers.push(popover);
      popover.button.addEventListener("click", () => {
        const opening = popover.panel.hidden;
        closeAll(popover);
        if (opening) {
          popover.build();
          alignPopover(popover);
        }
        popover.panel.hidden = !opening;
        popover.button.setAttribute("aria-expanded", String(opening));
      });
      return popover;
    };
    const swatchBar = (id, colour) => {
      byId(id).style.background = colour;
    };
    const paletteBuilder = (kind, colours, barId, resetLabel) => (panel) => {
      panel.textContent = "";
      const grid = doc.createElement("div");
      grid.className = "swatches";
      for (const colour of colours) {
        const swatch = doc.createElement("button");
        swatch.type = "button";
        swatch.style.background = colour;
        swatch.title = colour;
        swatch.setAttribute("aria-label", colour);
        swatch.addEventListener("click", () => {
          applyColor(editor, kind, colour);
          swatchBar(barId, colour);
          closeAll();
        });
        grid.appendChild(swatch);
      }
      panel.appendChild(grid);
      const reset = doc.createElement("button");
      reset.type = "button";
      reset.className = "reset";
      reset.textContent = resetLabel();
      reset.addEventListener("click", () => {
        applyColor(editor, kind, null);
        closeAll();
      });
      panel.appendChild(reset);
    };
    register("text-colour", "text-colour-menu", paletteBuilder("color", TEXT_COLOURS, "text-colour-bar", () => labels().colourAutomatic));
    register("highlight", "highlight-menu", paletteBuilder("highlight", HIGHLIGHTS, "highlight-bar", () => labels().highlightNone));
    swatchBar("highlight-bar", HIGHLIGHTS[0]);
    register("table", "table-menu", (panel) => buildTableMenu(panel, editor, doc, labels(), closeAll));
    doc.addEventListener("mousedown", (event) => {
      if (!event.target?.closest?.(".menu"))
        closeAll();
    });
    doc.addEventListener("keydown", (event) => {
      if (event.key === "Escape")
        closeAll();
    });
    return {
      applyLabels(current) {
        editor.dataset.placeholder = current.placeholder;
        editor.setAttribute("aria-label", current.placeholder);
        const title = (selector, text) => {
          const node = root.querySelector(selector);
          if (node)
            node.title = text;
        };
        title('[data-command="bold"]', current.bold);
        title('[data-command="italic"]', current.italic);
        title('[data-command="underline"]', current.underline);
        title("#bullet-list", current.bulletedList);
        title("#ordered-list", current.numberedList);
        title("#indent", current.indent);
        title("#outdent", current.outdent);
        title("#text-colour", current.textColour);
        title("#highlight", current.highlight);
        title("#table", current.table);
        fontSize.title = current.fontSize;
        fontSize.setAttribute("aria-label", current.fontSize);
        const sizeText = {
          Normal: current.sizeNormal,
          Small: current.sizeSmall,
          Large: current.sizeLarge,
          Huge: current.sizeHuge
        };
        for (const option of Array.from(fontSize.options)) {
          const text = sizeText[option.value];
          if (text)
            option.textContent = text;
        }
        closeAll();
      }
    };
  }
  function buildTableMenu(panel, editor, doc, labels, close) {
    panel.textContent = "";
    const picker = doc.createElement("div");
    picker.className = "grid-picker";
    const size = doc.createElement("p");
    size.className = "grid-size";
    size.textContent = labels.insertTable;
    const cells = [];
    const paint = (rows, columns) => {
      cells.forEach((cell2, index) => {
        const row = Math.floor(index / PICKER_COLUMNS);
        const column = index % PICKER_COLUMNS;
        cell2.classList.toggle("on", row < rows && column < columns);
      });
      size.textContent = rows > 0 ? `${rows} × ${columns}` : labels.insertTable;
    };
    for (let row = 0;row < PICKER_ROWS; row += 1) {
      for (let column = 0;column < PICKER_COLUMNS; column += 1) {
        const cell2 = doc.createElement("span");
        cell2.addEventListener("mouseenter", () => paint(row + 1, column + 1));
        cell2.addEventListener("click", () => {
          insertTable(editor, row + 1, column + 1);
          close();
        });
        cells.push(cell2);
        picker.appendChild(cell2);
      }
    }
    picker.addEventListener("mouseleave", () => paint(0, 0));
    panel.append(picker, size);
    const cell = cellAtCaret(editor);
    if (!cell)
      return;
    panel.appendChild(doc.createElement("hr"));
    const items = doc.createElement("div");
    items.className = "menu-items";
    const action = (text, run) => {
      const button = doc.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.addEventListener("click", () => {
        run();
        close();
      });
      items.appendChild(button);
    };
    action(labels.insertRowAbove, () => insertRow(editor, cell, false));
    action(labels.insertRowBelow, () => insertRow(editor, cell, true));
    action(labels.insertColumnLeft, () => insertColumn(editor, cell, false));
    action(labels.insertColumnRight, () => insertColumn(editor, cell, true));
    items.appendChild(doc.createElement("hr"));
    action(labels.deleteRow, () => deleteRow(editor, cell));
    action(labels.deleteColumn, () => deleteColumn(editor, cell));
    action(labels.deleteTable, () => deleteTable(editor, cell));
    panel.appendChild(items);
  }
  function legacy(editor, command) {
    editor.focus({ preventScroll: true });
    documentOf(editor).execCommand?.(command, false);
  }

  // src/main.ts
  var doc = document;
  var editor = doc.getElementById("editor");
  var toolbarRoot = doc.querySelector(".toolbar");
  var attachments = new Attachments;
  var labels = DEFAULT_LABELS;
  var toolbar = installToolbar(editor, toolbarRoot, () => labels);
  var chrome = installNativeChrome(editor, toolbarRoot);
  editor.addEventListener("paste", (event) => {
    event.preventDefault();
    const images = imageFilesFrom(event.clipboardData);
    if (images.length > 0) {
      insertImageFiles(editor, attachments, images, saveSelection(editor));
      return;
    }
    const text = event.clipboardData?.getData("text/plain") ?? "";
    doc.execCommand?.("insertText", false, text);
  });

  editor.addEventListener("drop", (event) => event.preventDefault());

    if (event.isComposing)
      return;
    if (event.key === " " && !event.metaKey && !event.ctrlKey && !event.altKey) {
      if (autoformatBulletList(editor)) {
        event.preventDefault();
        return;
      }
    }
    if ((event.metaKey || event.ctrlKey) && !event.altKey) {
      const command = { b: "bold", i: "italic", u: "underline" }[event.key.toLowerCase()];

        event.preventDefault();
        applyMark(editor, command);
      }
      return;
    }
    if (event.key !== "Tab")
      return;
    event.preventDefault();
    if (indentSelection(editor, event.shiftKey))
      return;
    if (moveToAdjacentCell(editor, event.shiftKey))
      return;
    if (!event.shiftKey) {

    }
  });
  editor.addEventListener("mousedown", (event) => {
    if (routeClickBelowSignature(editor, event.target))
      event.preventDefault();
  });
  function parsed(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }
  window.addComposerAttachment = (meta) => attachments.add(meta);
  window.addComposerInlineImage = (meta) => attachments.addInlineImage(editor, meta);
  window.insertComposerImage = (image) => insertCapturedImage(editor, attachments, parsed(image));
  window.setComposerQuote = (quote) => setComposerQuote(editor, parsed(quote));
  window.setComposerQuoteStyle = (style) => setComposerQuoteStyle(editor, style);
  window.setComposerSignature = (signature) => setComposerSignature(editor, signature == null ? null : parsed(signature));
  window.setSignatureBody = (html, placeholder) => setSignatureBody(editor, html, placeholder);
  window.signatureBody = () => JSON.stringify(signatureBody(editor));
  window.focusComposerBody = () => focusComposerBody(editor);
  window.setPlainText = (text) => setPlainText(editor, text);
  window.useNativeComposerChrome = () => chrome.useNativeComposerChrome();
  window.setComposerTopInset = (cssPx) => chrome.setComposerTopInset(cssPx);
  window.setComposerLabels = (incoming) => {
    labels = mergeLabels(labels, incoming);
    toolbar.applyLabels(labels);
  };
  window.insertSignatureImage = (image) => {
    const data = (image ? parsed(image) : {}) ?? {};
    const url = String(data.data_url ?? "");
    if (!url.startsWith("data:image/") || safePreviewUrl(url) === "")
      return;
    const node = doc.createElement("img");
    node.src = url;
    node.alt = String(data.alt_text ?? "");
    if (data.width_px)
      node.width = Number(data.width_px);
    focusEditor(editor);
    insertAtCaret(editor, node);
  };
  window.composerDocument = () => {
    const blocks = documentBlocks(editor);
    return JSON.stringify({
      blocks,
      attachments: attachments.list(referencedAttachmentIds(blocks))
    });
  };
})();
  </script>
