<!doctype html>
<!-- No `lang`, deliberately. It is what the engine's spell checker keys off, and a mail composer has
     no one language: the same person writes Dutch to family and English to work, often in one
     session. Any fixed value spellchecks every message against it, and on macOS it also overrides
     NSSpellChecker's per-paragraph "Automatic by Language". Absent, each host falls back to the
     user's own configured dictionaries. The signature editor loads this document too. -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Composer</title>
  <style>
    :root {
      color-scheme: light;
      --border: #d8dde3;
      --text: #152330;
      --muted: #5f6b73;
      --surface: #fbfbf8;
      --control: #ffffff;
      --active: #16598d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--surface);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* On a touch host nothing here is under 16px, because 16px is the size below which WebKit
       zooms the whole page in when an editable or a `select` takes focus: its "make the field
       readable" behaviour, which a page cannot decline except by locking `maximum-scale`, and
       that takes pinch-zoom away with it. In a composer the zoom is pure damage: the toolbar
       grows past the edge of the web view, the caret drifts under it, and nothing returns to
       scale until the field is blurred. Sized on `html`/`body` rather than on the elements that
       trigger it, so a control added to the toolbar later cannot reintroduce it. */
    @media (pointer: coarse) {
      html,
      body {
        font-size: 16px;
      }
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--border);
      background: #f6f8fa;
    }

    button,
    select {
      min-height: 30px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control);
      color: var(--text);
      font: inherit;
    }

    button {
      min-width: 32px;
      padding: 0 9px;
    }

    button:active,
    select:focus,
    button:focus {
      outline: 2px solid color-mix(in srgb, var(--active) 35%, transparent);
      outline-offset: 1px;
    }

    select {
      padding: 0 8px;
      max-width: 9em;
    }

    /* A hairline between groups of related controls, so eleven buttons read as four groups. */
    .toolbar .sep {
      width: 1px;
      align-self: stretch;
      margin: 2px 2px;
      background: var(--border);
    }

    .toolbar svg {
      display: block;
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* The colour buttons show the colour they will apply as a bar under the glyph, so the control
       says what it does without opening it. */
    .swatch-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 0 8px;
      line-height: 1;
    }

    .swatch-button .bar {
      width: 16px;
      height: 3px;
      border-radius: 1px;
      background: var(--text);
      /* A pale colour needs an edge or it looks like an empty control on the white button. */
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
    }

    .editor {
      flex: 1;
      min-height: 180px;
      padding: 14px;
      overflow: auto;
      background: #ffffff;
      outline: none;
      word-break: break-word;
    }

    .editor:empty::before {
      content: attr(data-placeholder);
      color: var(--muted);
    }

    /* Native-chrome mode (Android): the native surface owns a single scroll; the compose
       header sits in a native overlay above this WebView and scrolls away as the message
       grows, and the toolbar pins just above the keyboard. So here the *page* scrolls (not an
       inner editor box), the toolbar is fixed to the viewport bottom, and the editor reserves
       room for the native header (top) and the fixed toolbar (bottom) via insets the host sets.
       Untouched hosts (macOS/Windows) keep the flex/inner-scroll layout above. */
    html.native-chrome,
    body.native-chrome {
      height: auto;
    }

    /* Keep the caret clear of the fixed toolbar: reserve the toolbar's height at the bottom when
       the browser scrolls the caret into view, so a newly typed line lands above it, not behind. */
    html.native-chrome {
      scroll-padding-bottom: var(--composer-bottom-inset, 56px);
    }

    body.native-chrome {
      display: block;
      min-height: 100%;
    }

    body.native-chrome .toolbar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      border-top: 1px solid var(--border);
      border-bottom: none;
      /* One row that scrolls sideways. Wrapped, every control on a phone took three rows above the
         keyboard and left the message two lines. */
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }

    /* Only while the message is being written (`syncWriting` in host.ts). */
    body.native-chrome:not(.composer-writing) .toolbar {
      display: none;
    }

    body.native-chrome .toolbar > * {
      flex: none;
    }

    /* The groups are reordered below, so the hairlines between them would fall in the wrong places. */
    body.native-chrome .toolbar .sep {
      display: none;
    }

    /* What a message on a phone uses most comes first, before the row scrolls: the marks, lists and
       links, then colour, then the layout controls, and the wide pickers last. */
    body.native-chrome .toolbar > [data-command] { order: 1; }
    body.native-chrome #bullet-list,
    body.native-chrome #ordered-list { order: 2; }
    body.native-chrome .toolbar > .menu:has(#link) { order: 3; }
    body.native-chrome .toolbar > .menu:has(#text-colour),
    body.native-chrome .toolbar > .menu:has(#highlight) { order: 4; }
    body.native-chrome #outdent,
    body.native-chrome #indent,
    body.native-chrome .toolbar > .menu:has(#align) { order: 5; }
    body.native-chrome .toolbar > .menu:has(#table),
    body.native-chrome #rule { order: 6; }
    body.native-chrome .toolbar > select { order: 7; }

    /* A finger's target. The row has the height for it now it is one row. */
    @media (pointer: coarse) {
      body.native-chrome .toolbar > button,
      body.native-chrome .toolbar > .menu > button,
      body.native-chrome .toolbar > select {
        min-height: 40px;
      }

      body.native-chrome .toolbar > button,
      body.native-chrome .toolbar > .menu > button {
        min-width: 40px;
      }
    }

    body.native-chrome .editor {
      flex: none;
      overflow: visible;
      box-sizing: border-box;
      /* Filling the viewport when empty, so tapping anywhere focuses the body, is measured in JS
         (`fillViewport`) and only applied here. Viewport-percentage units are dead in this WebView:
         it is laid out after the page loads, so its layout viewport is fixed at zero height and both
         `100vh` and `100%` compute to `0px` with no warning. Do not "simplify" this back to
         `min-height: 100vh`; it silently does nothing and the body stops being tappable. */
      min-height: var(--composer-fill-height, 0px);
      /* 16px sides to line up with the native header fields' inset, and 12px between the header's last
         line and the message's first, so the message does not read as part of the Subject field. */
      padding: calc(var(--composer-top-inset, 14px) + 12px) 16px var(--composer-bottom-inset, 56px);
    }

    p {
      margin: 0 0 10px;
    }

    /* Headings keep the sizes and weight a browser gives them, which is how they read in every client
       the message reaches; only the margins follow the body's rhythm. */
    .editor :is(h1, h2, h3, h4, h5, h6) {
      margin: 0 0 10px;
    }

    /* A rule keeps the look a browser gives it, which is what the recipient sees. */
    .editor hr {
      margin: 10px 0;
    }

    /* The reading view's link colour (`mailcal-app`'s base sheet); a bookmark with no target is no
       link. The underline is drawn here only: `elementMarks` does not read it as a mark. */
    .editor a[href] {
      color: #2864d6;
      text-decoration: underline;
    }

    ul,
    ol {
      margin: 0 0 10px 22px;
      padding: 0;
    }

    /* A sub-list is inside its parent <li>, so it must not repeat the outer block's bottom margin,
       that would open a gap between an indented item and the one after it. */
    li > ul,
    li > ol {
      margin-bottom: 0;
    }

    table {
      width: 100%;
      margin: 0 0 10px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    td,
    th {
      min-width: 48px;
      min-height: 28px;
      padding: 6px;
      border: 1px solid var(--border);
      vertical-align: top;
    }

    /* Constrain every image to the editor width and keep its aspect ratio: editor-inserted
       attachments (which carry data-attachment-id) AND the inline images carried in a quoted
       reply/forward (raw <img src="data:…"> with no data-attachment-id). Without this, a
       quoted signature logo renders at its intrinsic size and overflows the editor. The
       `height: auto !important` keeps a quoted image whose original CSS/inline style pinned
       its height from being squashed when the width is capped; mirrors the reading view's
       BASE_CSS (docs/rendering-security.md). */
    img {
      max-width: 100%;
      height: auto !important;
    }

    /* Preformatted text keeps its line breaks and wraps at the editor's edge, which is how
       Thunderbird shows the `<pre wrap>` its quotes are written in. Unwrapped, one long line on a
       phone widens the whole page, and the pinned toolbar ends up beside the screen. The editor's
       view only: the message keeps the markup it was written in. */
    pre {
      white-space: pre-wrap;
    }

    /* The quoted original on reply/forward. The attribution is display-only; the body stays
       editable so the user can trim it. The two styles mirror the Rust composer renderer
       (mailcal-composer): Indented puts the body in a left border, LineAndHeader divides it
       off with a rule and shows a labeled header block. The two tokens are the Rust
       QuoteStyle variant names, which serialize verbatim into the seed JSON. */
    .allodia-quote {
      margin: 14px 0 0;
    }

    .allodia-quote[data-quote-style="LineAndHeader"] {
      border-top: 1pt solid rgb(181, 196, 223);
      padding-top: 3pt;
    }

    .aq-attr {
      color: var(--muted);
      margin: 0 0 8px;
      white-space: pre-wrap;
    }

    /* A plain-text original keeps the line breaks its sender wrote, and `quote.ts` states that
       inline on the `.aq-plain` wrapper rather than here: this stylesheet is the editor's own and
       never reaches the recipient, while the wrapper is serialised into the sent message. */

    .allodia-quote[data-quote-style="Indented"] .aq-body {
      margin: 0 0 0 0.8ex;
      padding-left: 1ex;
      border-left: 2px solid #cccccc;
    }

    /* The sender's signature. Editable like any other body content (Outlook's model: seeded,
       then yours to trim before sending) and given no decoration of its own; whatever the user
       authored in Settings is exactly what they should see here, and what goes out. The margin
       is the only editor-side addition, so the seeded block doesn't butt against the line above
       it; the Rust renderer emits the same wrapper class with no styling at all. */
    .allodia-signature {
      margin: 14px 0 0;
    }

    /* --- Resizing a picture ---
       Drawn over the picture from OUTSIDE the editor, and placed by `resize.ts`, whose header explains
       why and holds the reach these insets have to agree with. Below the toolbar and its popovers
       (z-index 2 and 3): the clip keeps the grips inside the editor's own box, and a popover that
       opens over it still wins. */
    .allodia-resize {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      outline: 1px solid var(--active);
    }

    .allodia-resize[hidden] {
      display: none;
    }

    .allodia-resize .grip {
      position: absolute;
      width: 12px;
      height: 12px;
      margin: -6px;
      border: 1px solid var(--active);
      border-radius: 50%;
      background: var(--control);
      box-shadow: 0 1px 3px rgba(21, 35, 48, 0.3);
      pointer-events: auto;
      /* The gesture is the grip's from the first touch: without this a finger on one scrolls the
         message instead of resizing the picture. */
      touch-action: none;
    }

    /* A finger needs a larger target than the dot a mouse aims at, and growing the dot would hide the
       corner it marks. A transparent extension is hit-tested with its parent, so the reach grows and
       the picture stays visible. */
    .allodia-resize .grip::after {
      content: "";
      position: absolute;
      inset: -9px;
    }

    @media (pointer: coarse) {
      .allodia-resize .grip {
        width: 18px;
        height: 18px;
        margin: -9px;
      }

      .allodia-resize .grip::after {
        inset: -12px;
      }
    }

    /* --- Popovers (colour palette, table menu) --- */

    .menu {
      position: relative;
      display: flex;
    }

    .popover {
      position: absolute;
      z-index: 3;
      top: calc(100% + 4px);
      left: 0;
      min-width: 168px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--control);
      box-shadow: 0 6px 18px rgba(21, 35, 48, 0.16);
    }

    .popover[hidden] {
      display: none;
    }

    /* In native-chrome mode the toolbar is pinned to the bottom of the viewport and scrolls sideways,
       so a popover hung from its button would open behind the keyboard and be clipped by the row. It
       is pinned to the viewport instead, just above the toolbar; `alignPopover` sets its left edge. */
    body.native-chrome .menu {
      position: static;
    }

    body.native-chrome .popover {
      position: fixed;
      top: auto;
      bottom: calc(var(--composer-bottom-inset, 56px) + 4px);
    }

    /* Keep a popover inside the viewport when its button sits near the right edge. */
    .popover.align-end {
      left: auto;
      right: 0;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(6, 22px);
      gap: 4px;
    }

    .swatches button {
      width: 22px;
      height: 22px;
      min-width: 0;
      padding: 0;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.18);
    }

    .popover .reset {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 0 8px;
      text-align: left;
      white-space: nowrap;
    }

    /* The insert-table size picker: hovering the grid previews the size, clicking commits it. */
    .grid-picker {
      display: grid;
      grid-template-columns: repeat(8, 16px);
      gap: 2px;
    }

    .grid-picker span {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border);
      border-radius: 2px;
      background: var(--control);
    }

    .grid-picker span.on {
      border-color: var(--active);
      background: color-mix(in srgb, var(--active) 18%, #ffffff);
    }

    .grid-size {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .menu-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-items button {
      min-height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      text-align: left;
      white-space: nowrap;
    }

    .menu-items button:hover:not(:disabled) {
      background: color-mix(in srgb, var(--active) 10%, transparent);
    }

    .menu-items button:disabled {
      color: var(--muted);
      opacity: 0.6;
    }

    .menu-items hr {
      margin: 4px 0;
      border: none;
      border-top: 1px solid var(--border);
    }

    /* The link editor: two labelled fields and its actions. */
    .link-menu {
      width: 280px;
      max-width: calc(100vw - 16px);
    }

    .link-menu .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .link-menu input {
      min-height: 30px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--control);
      color: var(--text);
      font: inherit;
      font-size: 1rem;
    }

    .link-menu input:focus {
      outline: 2px solid color-mix(in srgb, var(--active) 35%, transparent);
      outline-offset: 1px;
    }

    .link-menu input[aria-invalid="true"] {
      border-color: #c00000;
    }

    .link-menu .actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
    }

    .link-menu .actions .primary {
      border-color: var(--active);
      background: var(--active);
      color: #ffffff;
    }

    .link-menu .actions button:disabled {
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="toolbar" role="toolbar">
    <button type="button" data-command="bold" title="Bold"><strong>B</strong></button>
    <button type="button" data-command="italic" title="Italic"><em>I</em></button>
    <button type="button" data-command="underline" title="Underline"><u>U</u></button>

    <span class="sep"></span>

    <div class="menu">
      <button type="button" class="swatch-button" id="text-colour" title="Text colour" aria-haspopup="true" aria-expanded="false">
        <span aria-hidden="true"><strong>A</strong></span>
        <span class="bar" id="text-colour-bar"></span>
      </button>
      <div class="popover" id="text-colour-menu" role="menu" hidden></div>
    </div>

    <div class="menu">
      <button type="button" class="swatch-button" id="highlight" title="Highlight" aria-haspopup="true" aria-expanded="false">
        <span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13h4l6.2-6.2a1.6 1.6 0 0 0 0-2.3l-1.7-1.7a1.6 1.6 0 0 0-2.3 0L3 9z"/><path d="M2.2 13.8h5"/></svg>
        </span>
        <span class="bar" id="highlight-bar"></span>
      </button>
      <div class="popover" id="highlight-menu" role="menu" hidden></div>
    </div>

    <select id="font-size" title="Font size" aria-label="Font size">
      <option value="15" data-label="sizeNormal">Normal</option>
      <option value="13" data-label="sizeSmall">Small</option>
      <option value="18" data-label="sizeLarge">Large</option>
      <option value="24" data-label="sizeHuge">Huge</option>
    </select>

    <!-- Each value is a family list in the document's canonical spelling. The names are the fonts'
         own, so only the first option is translated. -->
    <select id="font-family" title="Font" aria-label="Font">
      <option value="" data-label="fontDefault">Default font</option>
      <option value="Arial, Helvetica, sans-serif">Arial</option>
      <option value="Calibri, Carlito, sans-serif">Calibri</option>
      <option value="Courier New, Courier, monospace">Courier New</option>
      <option value="Georgia, serif">Georgia</option>
      <option value="Times New Roman, Times, serif">Times New Roman</option>
      <option value="Trebuchet MS, sans-serif">Trebuchet MS</option>
      <option value="Verdana, Geneva, sans-serif">Verdana</option>
    </select>

    <select id="block-style" title="Paragraph style" aria-label="Paragraph style">
      <option value="" data-label="blockNormal">Normal text</option>
      <option value="H1" data-label="heading1">Heading 1</option>
      <option value="H2" data-label="heading2">Heading 2</option>
      <option value="H3" data-label="heading3">Heading 3</option>
      <option value="H4" data-label="heading4">Heading 4</option>
      <option value="H5" data-label="heading5">Heading 5</option>
      <option value="H6" data-label="heading6">Heading 6</option>
    </select>

    <span class="sep"></span>

    <button type="button" id="bullet-list" title="Bulleted list">&bull;</button>
    <button type="button" id="ordered-list" title="Numbered list">1.</button>
    <button type="button" id="outdent" title="Decrease indent">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3.5h7M7 8h7M7 12.5h7M4.5 6 2 8l2.5 2"/></svg>
    </button>
    <button type="button" id="indent" title="Increase indent">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M7 3.5h7M7 8h7M7 12.5h7M2 6l2.5 2L2 10"/></svg>
    </button>

    <div class="menu">
      <button type="button" id="align" title="Alignment" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12M2 6.5h8M2 9.5h12M2 12.5h8"/></svg>
      </button>
      <div class="popover" id="align-menu" role="menu" hidden></div>
    </div>

    <span class="sep"></span>

    <div class="menu">
      <button type="button" id="link" title="Link" aria-haspopup="dialog" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.6 9.4a2.9 2.9 0 0 0 4.1 0l2.4-2.4a2.9 2.9 0 0 0-4.1-4.1l-1 1"/><path d="M9.4 6.6a2.9 2.9 0 0 0-4.1 0L2.9 9a2.9 2.9 0 0 0 4.1 4.1l1-1"/></svg>
      </button>
      <div class="popover link-menu" id="link-menu" role="dialog" hidden></div>
    </div>

    <div class="menu">
      <button type="button" id="table" title="Table" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1"/><path d="M1.5 6.2h13M1.5 9.9h13M6 2.5v11M10.5 2.5v11"/></svg>
      </button>
      <div class="popover" id="table-menu" role="menu" hidden></div>
    </div>

    <button type="button" id="rule" title="Horizontal line">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8h13"/></svg>
    </button>
  </div>
  <main id="editor" class="editor" contenteditable="true" data-placeholder="Write your message" aria-label="Write your message"></main>
  <script>
(() => {
  // src/dom.ts
  function documentOf(node) {
    return node.ownerDocument ?? node;
  }
  function windowOf(node) {
    const view = documentOf(node).defaultView;
    if (!view)
      throw new Error("editor node is detached from a window");
    return view;
  }
  function focusEditor(editor) {
    editor.focus({ preventScroll: true });
  }
  function rangeWithin(editor) {
    const selection = windowOf(editor).getSelection();
    if (!selection || selection.rangeCount === 0)
      return null;
    const range = selection.getRangeAt(0);
    return editor.contains(range.startContainer) ? range : null;
  }
  function ancestorAtCaret(editor, ...tags) {
    const range = rangeWithin(editor);
    return range ? ancestorOf(range.startContainer, editor, ...tags) : null;
  }
  function ancestorOf(node, editor, ...tags) {
    const wanted = new Set(tags.map((tag) => tag.toUpperCase()));
    let current = node;
    while (current && current !== editor) {
      if (current.nodeType === 1 && wanted.has(current.tagName)) {
        return current;
      }
      current = current.parentNode;
    }
    return null;
  }
  function saveSelection(editor) {

      return false;
    caretInto(next);
    return true;
  }

  // src/paragraphs.ts
  var LINE_TAGS2 = new Set(["P", "DIV", "H1", "H2", "H3", "H4", "H5", "H6"]);
  var OUTSIDE_LINES = "li, td, th, .allodia-quote, .allodia-signature";
  function selectedLines(editor) {
    const range = rangeWithin(editor);
    if (!range)
      return [];
    const doc = documentOf(editor);
    return Array.from(editor.querySelectorAll("p, div, h1, h2, h3, h4, h5, h6")).filter((line) => {
      if (line.closest(OUTSIDE_LINES))
        return false;
      if (Array.from(line.children).some((child) => LINE_TAGS2.has(child.tagName) || child.tagName === "UL" || child.tagName === "OL" || child.tagName === "TABLE")) {
        return false;
      }
      const own = doc.createRange();
      own.selectNodeContents(line);
      return rangeOverlaps(range, own);
    });
  }
  function eachLine(editor, change) {
    const lines = selectedLines(editor);
    if (lines.length === 0)
      return false;
    const caret = saveSelection(editor);
    for (const line of lines) {
      const current = lineStyleOf(line, NO_CONTEXT);
      const next = change(line, current);
      const element = lineTag(next) === lineTag(current) ? line : retag(line, lineTag(next));
      applyLineStyle(element, next);
    }
    restoreSelection(editor, caret);
    focusEditor(editor);
    return true;
  }
  function retag(line, tag) {
    const element = documentOf(line).createElement(tag);
    for (const attribute of Array.from(line.attributes))
      element.setAttribute(attribute.name, attribute.value);
    while (line.firstChild)
      element.appendChild(line.firstChild);
    line.replaceWith(element);
    return element;
  }
  function setHeading(editor, heading) {
    return eachLine(editor, (_, style) => {
      const next = { ...style };
      if (heading)
        next.heading = heading;
      else
        delete next.heading;
      return next;
    });
  }
  function setAlign(editor, align) {
    return eachLine(editor, (_, style) => {
      const next = { ...style };
      if (align)
        next.align = align;
      else
        delete next.align;
      return next;
    });
  }
  function indentLines(editor, outdent) {
    return eachLine(editor, (_, style) => {
      const current = style.indent_px ?? 0;
      const indent = outdent ? Math.max(0, current - INDENT_STEP_PX) : Math.min(MAX_INDENT_PX, current + INDENT_STEP_PX);
      const next = { ...style };
      if (indent > 0)
        next.indent_px = indent;
      else
        delete next.indent_px;
      return next;
    });
  }
  function insertRule(editor) {
    const range = rangeWithin(editor);
    const doc = documentOf(editor);
    let block = range?.startContainer ?? null;
    while (block && block.parentNode !== editor)
      block = block.parentNode;
    const rule = doc.createElement("hr");
    if (block)
      editor.insertBefore(rule, block.nextSibling);
    else
      editor.appendChild(rule);
    let next = rule.nextElementSibling;
    if (!next || !LINE_TAGS2.has(next.tagName)) {
      next = emptyLine(doc);
      editor.insertBefore(next, rule.nextSibling);
    }
    caretInto(next, true);
    focusEditor(editor);
  }

  // src/toolbar.ts
  var TEXT_COLOURS = [
    "#000000",
    "#7f7f7f",
    "#c00000",
    "#ff0000",
    "#ffc000",
    "#ffff00",
    "#92d050",
    "#00b050",
    "#00b0f0",
    "#0070c0",
    "#002060",
    "#7030a0"
  ];
  var HIGHLIGHTS = ["#ffff00", "#92d050", "#00ffff", "#ff99cc", "#ffc000", "#c0c0c0"];
  var PICKER_ROWS = 6;
  var PICKER_COLUMNS = 8;
  var VIEWPORT_MARGIN = 8;
  function installToolbar(editor, root, labels, openLinkInHost = () => false) {
    const doc = documentOf(root);
    const byId = (id) => {
      const node = doc.getElementById(id);
      if (!node)
        throw new Error(`editor markup is missing #${id}`);
      return node;
    };
    root.addEventListener("mousedown", (event) => {
      const target = event.target;
      if (!target?.closest?.("select, input"))
        event.preventDefault();
    });
    for (const button of Array.from(root.querySelectorAll("[data-command]"))) {
      button.addEventListener("click", () => {
        const command = button.dataset.command;
        if (command === "bold" || command === "italic" || command === "underline") {
          applyMark(editor, command);
        }
      });
    }
    const fontSize = byId("font-size");
    fontSize.addEventListener("change", () => {
      const size = fontSizeOf(Number(fontSize.value));
      if (size)
        applyFontSize(editor, size);
    });
    const fontFamily = byId("font-family");
    fontFamily.addEventListener("change", () => applyFontFamily(editor, fontFamily.value || null));
    const blockStyle = byId("block-style");
    blockStyle.addEventListener("change", () => {
      const value = blockStyle.value;
      setHeading(editor, HEADINGS.includes(value) ? value : null);
    });
    byId("bullet-list").addEventListener("click", () => legacy(editor, "insertUnorderedList"));
    byId("ordered-list").addEventListener("click", () => legacy(editor, "insertOrderedList"));
    byId("indent").addEventListener("click", () => indentSelection(editor, false) || indentLines(editor, false));
    byId("outdent").addEventListener("click", () => indentSelection(editor, true) || indentLines(editor, true));
    byId("rule").addEventListener("click", () => insertRule(editor));
    const alignPopover = (popover) => {
      popover.panel.classList.remove("align-end");
      popover.panel.style.left = "";
      const width = doc.documentElement.clientWidth || windowOf(editor).innerWidth;
      const wasHidden = popover.panel.hidden;
      popover.panel.hidden = false;
      const button = popover.button.getBoundingClientRect();
      const panel = popover.panel.getBoundingClientRect();
      popover.panel.hidden = wasHidden;
      if (windowOf(editor).getComputedStyle(popover.panel).position === "fixed") {
        const furthest = Math.max(VIEWPORT_MARGIN, width - panel.width - VIEWPORT_MARGIN);
        popover.panel.style.left = `${Math.min(Math.max(VIEWPORT_MARGIN, button.left), furthest)}px`;
        return;
      }
      if (width <= 0 || panel.width <= 0 || button.left + panel.width <= width)
        return;
      if (button.left + button.width - panel.width >= 0) {
        popover.panel.classList.add("align-end");
        return;
      }
      const left = Math.max(VIEWPORT_MARGIN, width - panel.width - VIEWPORT_MARGIN);
      popover.panel.style.left = `${left - button.left}px`;
    };
    const popovers = [];
    const closeAll = (except) => {
      for (const popover of popovers) {
        if (popover === except)
          continue;
        popover.panel.hidden = true;
        popover.button.setAttribute("aria-expanded", "false");
      }
    };
    const register = (buttonId, panelId, build) => {
      const popover = {
        button: byId(buttonId),
        panel: byId(panelId),
        build: () => build(byId(panelId))
      };
      popovers.push(popover);
      popover.button.addEventListener("click", () => toggle(popover));
      return popover;
    };
    const toggle = (popover) => {
      const opening = popover.panel.hidden;
      closeAll(popover);
      if (opening) {
        popover.build();
        alignPopover(popover);
      }
      popover.panel.hidden = !opening;
      popover.button.setAttribute("aria-expanded", String(opening));
    };
    const swatchBar = (id, colour) => {
      byId(id).style.background = colour;
    };
    const paletteBuilder = (kind, colours, barId, resetLabel) => (panel) => {
      panel.textContent = "";
      const grid = doc.createElement("div");
      grid.className = "swatches";
      for (const colour of colours) {
        const swatch = doc.createElement("button");
        swatch.type = "button";
        swatch.style.background = colour;
        swatch.title = colour;
        swatch.setAttribute("aria-label", colour);
        swatch.addEventListener("click", () => {
          applyColor(editor, kind, colour);
          swatchBar(barId, colour);
          closeAll();
        });
        grid.appendChild(swatch);
      }
      panel.appendChild(grid);
      const reset = doc.createElement("button");
      reset.type = "button";
      reset.className = "reset";
      reset.textContent = resetLabel();
      reset.addEventListener("click", () => {
        applyColor(editor, kind, null);
        closeAll();
      });
      panel.appendChild(reset);
    };
    register("text-colour", "text-colour-menu", paletteBuilder("color", TEXT_COLOURS, "text-colour-bar", () => labels().colourAutomatic));
    register("highlight", "highlight-menu", paletteBuilder("highlight", HIGHLIGHTS, "highlight-bar", () => labels().highlightNone));
    swatchBar("highlight-bar", HIGHLIGHTS[0]);
    register("table", "table-menu", (panel) => buildTableMenu(panel, editor, doc, labels(), closeAll));
    register("align", "align-menu", (panel) => buildAlignMenu(panel, editor, doc, labels(), closeAll));
    const link = {
      button: byId("link"),
      panel: byId("link-menu"),
      build: () => buildLinkMenu(byId("link-menu"), editor, doc, labels(), () => closeAll())
    };
    popovers.push(link);
    const openLink = () => {
      if (!link.panel.hidden)
        return;
      if (openLinkInHost())
        closeAll();
      else
        toggle(link);
    };
    link.button.addEventListener("click", () => link.panel.hidden ? openLink() : toggle(link));
    doc.addEventListener("mousedown", (event) => {
      if (!event.target?.closest?.(".menu"))
        closeAll();
    });
    doc.addEventListener("keydown", (event) => {
      if (event.key === "Escape")
        closeAll();
    });
    return {
      openLink,
      closePopovers: () => closeAll(),
      applyLabels(current) {
        editor.dataset.placeholder = current.placeholder;
        editor.setAttribute("aria-label", current.placeholder);
        const title = (selector, text) => {
          const node = root.querySelector(selector);
          if (node)
            node.title = text;
        };
        title('[data-command="bold"]', current.bold);
        title('[data-command="italic"]', current.italic);
        title('[data-command="underline"]', current.underline);
        title("#bullet-list", current.bulletedList);
        title("#ordered-list", current.numberedList);
        title("#indent", current.indent);
        title("#outdent", current.outdent);
        title("#text-colour", current.textColour);
        title("#highlight", current.highlight);
        title("#table", current.table);
        title("#link", current.link);
        title("#align", current.align);
        title("#rule", current.horizontalRule);
        for (const [select, text] of [
          [fontSize, current.fontSize],
          [fontFamily, current.fontFamily],
          [blockStyle, current.blockStyle]
        ]) {
          select.title = text;
          select.setAttribute("aria-label", text);
        }
        for (const option of Array.from(root.querySelectorAll("option[data-label]"))) {
          const text = current[option.dataset.label];
          if (text)
            option.textContent = text;
        }
        closeAll();
      }
    };
  }
  function buildTableMenu(panel, editor, doc, labels, close) {
    panel.textContent = "";
    const picker = doc.createElement("div");
    picker.className = "grid-picker";
    const size = doc.createElement("p");
    size.className = "grid-size";
    size.textContent = labels.insertTable;
    const cells = [];
    const paint = (rows, columns) => {
      cells.forEach((cell, index) => {
        const row = Math.floor(index / PICKER_COLUMNS);
        const column = index % PICKER_COLUMNS;
        cell.classList.toggle("on", row < rows && column < columns);
      });
      size.textContent = rows > 0 ? `${rows} × ${columns}` : labels.insertTable;
    };
    for (let row = 0;row < PICKER_ROWS; row += 1) {
      for (let column = 0;column < PICKER_COLUMNS; column += 1) {
        const cell = doc.createElement("span");
        cell.addEventListener("mouseenter", () => paint(row + 1, column + 1));
        cell.addEventListener("click", () => {
          insertTable(editor, row + 1, column + 1);
          close();
        });
        cells.push(cell);
        picker.appendChild(cell);
      }
    }
    picker.addEventListener("mouseleave", () => paint(0, 0));
    panel.append(picker, size);
    const cell = cellAtCaret(editor);
    if (!cell)
      return;
    panel.appendChild(doc.createElement("hr"));
    const items = doc.createElement("div");
    items.className = "menu-items";
    const action = (text, run) => {
      const button = doc.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.addEventListener("click", () => {
        run();
        close();
      });
      items.appendChild(button);
    };
    action(labels.insertRowAbove, () => insertRow(editor, cell, false));
    action(labels.insertRowBelow, () => insertRow(editor, cell, true));
    action(labels.insertColumnLeft, () => insertColumn(editor, cell, false));
    action(labels.insertColumnRight, () => insertColumn(editor, cell, true));
    items.appendChild(doc.createElement("hr"));
    action(labels.deleteRow, () => deleteRow(editor, cell));
    action(labels.deleteColumn, () => deleteColumn(editor, cell));
    action(labels.deleteTable, () => deleteTable(editor, cell));
    panel.appendChild(items);
  }
  function buildAlignMenu(panel, editor, doc, labels, close) {
    panel.textContent = "";
    const items = doc.createElement("div");
    items.className = "menu-items";
    const choices = [
      [labels.alignLeft, null],
      [labels.alignCentre, "Center"],
      [labels.alignRight, "Right"],
      [labels.alignJustify, "Justify"]
    ];
    for (const [text, align] of choices) {
      const button = doc.createElement("button");
      button.type = "button";
      button.textContent = text;
      button.addEventListener("click", () => {
        setAlign(editor, align);
        close();
      });
      items.appendChild(button);
    }
    panel.appendChild(items);
  }
  function legacy(editor, command) {
    editor.focus({ preventScroll: true });
    documentOf(editor).execCommand?.(command, false);
  }

  // src/main.ts
  var doc = document;
  var editor = doc.getElementById("editor");
  var toolbarRoot = doc.querySelector(".toolbar");
  var attachments = new Attachments;
  var hostRequests = new HostRequests(window);
  var history = installHistory(editor);
  var apple = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
  var labels = DEFAULT_LABELS;
  var toolbar = installToolbar(editor, toolbarRoot, () => labels, () => {
    if (!hostRequests.answers("link"))
      return false;
    editLinkThroughHost(editor, hostRequests);
    return true;
  });
  var chrome = installNativeChrome(editor, toolbarRoot, () => toolbar.closePopovers());
  installImageResize(editor);
  var revision = installRevisionCounter(editor);
  editor.addEventListener("paste", (event) => {
    event.preventDefault();
    const content = pasteContent(doc, event.clipboardData, caretHoldsInlineOnly(), attachments);
    if ("images" in content) {
      insertImageFiles(editor, attachments, content.images, saveSelection(editor));
      return;
    }
    if ("html" in content && insertHtml(content.html))
      return;
    execCommand("insertText", event.clipboardData?.getData("text/plain") ?? "");
  });
  function caretHoldsInlineOnly() {
    const caret = rangeWithin(editor)?.startContainer ?? null;
    return ancestorOf(caret, editor, "li", "td", "th") !== null;
  }
  function insertHtml(html) {
    return execCommand("insertHTML", html);
  }
  function execCommand(command, value) {
    const exec = doc.execCommand;
    return exec?.call(doc, command, false, value) ?? false;
  }
  editor.addEventListener("dragover", (event) => event.preventDefault());
  editor.addEventListener("drop", (event) => event.preventDefault());
  editor.addEventListener("keydown", (event) => {
    if (event.isComposing)
      return;
    const step = historyChord(event, apple);
    if (step) {
      event.preventDefault();
      if (step === "undo")
        history.undo();
      else
        history.redo();
      return;
    }
    if (event.key === " " && !event.metaKey && !event.ctrlKey && !event.altKey) {
      if (autoformatBulletList(editor)) {
        event.preventDefault();
        history.typed(" ");
        return;
      }
      if (autolinkBeforeCaret(editor, " ")) {
        event.preventDefault();
        history.typed(" ");
        return;
      }
    }
    if (event.key === "Enter" && !event.metaKey && !event.ctrlKey) {
      autolinkBeforeCaret(editor, null);
    }
    if ((event.metaKey || event.ctrlKey) && !event.altKey && event.key.toLowerCase() === "k") {
      event.preventDefault();
      toolbar.openLink();
      return;
    }
    if ((event.metaKey || event.ctrlKey) && !event.altKey) {
      const command = { b: "bold", i: "italic", u: "underline" }[event.key.toLowerCase()];
      if (command === "bold" || command === "italic" || command === "underline") {
        event.preventDefault();
        applyMark(editor, command);
      }
      return;
    }
    if (event.key !== "Tab")
      return;
    event.preventDefault();
    if (indentSelection(editor, event.shiftKey))
      return;
    if (moveToAdjacentCell(editor, event.shiftKey))
      return;
    if (!event.shiftKey)
      execCommand("insertText", "\t");
  });
  editor.addEventListener("mousedown", (event) => {
    if (routeClickBelowSignature(editor, event.target))
      event.preventDefault();
  });
  function parsed(value) {
    return typeof value === "string" ? JSON.parse(value) : value;
  }
  window.addComposerAttachment = (meta) => attachments.add(meta);
  window.addComposerInlineImage = (meta) => attachments.addInlineImage(editor, meta);
  window.insertComposerImage = (image) => insertCapturedImage(editor, attachments, parsed(image));
  window.pasteComposerHtml = (html) => {
    if (!rangeWithin(editor))
      return false;
    const markup = pastedHtml(doc, typeof html === "string" ? html : "", caretHoldsInlineOnly(), attachments);
    return markup !== null && insertHtml(markup);
  };
  window.setComposerQuote = (quote) => history.restart(() => setComposerQuote(editor, parsed(quote)));
  window.setComposerQuoteStyle = (style) => history.outside(() => setComposerQuoteStyle(editor, style));
  window.completeComposerQuoteAttribution = (attribution) => history.outside(() => completeComposerQuoteAttribution(editor, parsed(attribution) ?? {}));
  window.setComposerSignature = (signature) => history.outside(() => setComposerSignature(editor, signature == null ? null : parsed(signature)));
  window.setSignatureBody = (html, placeholder) => history.restart(() => setSignatureBody(editor, html, placeholder));
  window.signatureBody = () => JSON.stringify(signatureBody(editor));
  window.focusComposerBody = () => focusComposerBody(editor);
  window.setPlainText = (text) => history.restart(() => setPlainText(editor, text));
  window.setComposerBody = (seed) => history.restart(() => setComposerBody(editor, attachments, parsed(seed) ?? {}));
  window.composerHistorySteps = () => JSON.stringify(history.steps());
  window.stepComposerHistory = (step) => step === "undo" ? history.undo() : step === "redo" ? history.redo() : false;
  window.useNativeComposerChrome = () => chrome.useNativeComposerChrome();
  window.setComposerTopInset = (cssPx) => chrome.setComposerTopInset(cssPx);
  window.setComposerHostRequests = (kinds) => {
    hostRequests.setAnswered(kinds);
    history.watch((steps) => hostRequests.tell("history", steps));
  };
  window.answerComposerRequest = (id, answer) => hostRequests.answer(id, answer);
  window.setComposerLabels = (incoming) => {
    labels = mergeLabels(labels, incoming);
    toolbar.applyLabels(labels);
  };
  window.insertSignatureImage = (image) => {
    const data = (image ? parsed(image) : {}) ?? {};
    const url = String(data.data_url ?? "");
    if (!url.startsWith("data:image/") || safePreviewUrl(url) === "")
      return;
    const node = doc.createElement("img");
    node.src = url;
    node.alt = String(data.alt_text ?? "");
    if (data.width_px)
      node.width = Number(data.width_px);
    focusEditor(editor);
    insertAtCaret(editor, node);
  };
  window.composerRevision = () => revision();
  window.composerDocument = () => {
    const blocks = documentBlocks(editor);
    return JSON.stringify({
      blocks,
      attachments: attachments.list(referencedAttachmentIds(blocks))
    });
  };
})();
