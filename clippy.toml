# Clippy reads the nearest `clippy.toml` above a crate's manifest and nothing beyond it, so a crate
# with one of its own (`crates/mailcal-bindings`) repeats this entry there.
disallowed-methods = [
    { path = "std::env::temp_dir", reason = "a fixed name under it is shared by every checkout running the same test at once: a test holds a `tempfile::TempDir`, and shipped code that needs the OS directory itself says why in an `#[expect]` at the call site" },
]
