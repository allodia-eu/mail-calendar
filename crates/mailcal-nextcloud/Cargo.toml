[package]
name = "mailcal-nextcloud"
description = "Nextcloud's own sign-in for native clients (Login Flow v2): recognising a Nextcloud server, obtaining an app password through the browser, and revoking it or answering a remote wipe. The protocol only; which account a password belongs to is the account layer's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mailcal-user-agent = { path = "../mailcal-user-agent" }
engine-tls = { workspace = true, features = ["reqwest"] }
reqwest = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
