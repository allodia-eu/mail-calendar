# Cargo settings that must hold for EVERY build of this workspace — not only the ones the client
# build scripts drive. This file is tracked; see the engine-override note at the bottom.

# ---------------------------------------------------------------------------------------------
# One build directory for every checkout, so worktrees share the compile work instead of each
# growing a multi-GB `target/`. Intermediates only: binaries and test executables still land in
# each worktree's `target/`, which is why an almost empty one is normal. Cargo locks the directory
# for the length of a build, so a second worktree waits; `CARGO_BUILD_BUILD_DIR` opts one out.
#
# Fixed name on purpose: `{workspace-path-hash}` would give every worktree its own directory and
# defeat the sharing. `{cargo-cache-home}` is CARGO_HOME, so no absolute path is committed.
# `rustc-wrapper` stays out of a tracked file: it would break every dev lacking that binary.
#
# ⚠️ **Sharing the directory means never baking an absolute path into a compiled artifact.** The
# cache key does not carry the worktree, so a test executable or example compiled by one checkout
# is reused by the next; anything `env!` resolved at compile time travels with it. `env!(
# "CARGO_BIN_EXE_<name>")` and `env!("CARGO_MANIFEST_DIR")` are the two that matter here, and both
# fail in the same direction: the artifact reads or spawns a *different* checkout's copy, and once
# that checkout is deleted it fails with `NotFound` in a tree whose diff cannot explain it. Cargo
# exports both variables to the process at run time as well, computed by the run that is happening
# now, so read them with `std::env::var` and keep the `env!` only as a fallback for running the
# binary outside cargo (`crates/mailcal-mcp-shim/tests/common/mod.rs`).
# ---------------------------------------------------------------------------------------------

[build]
build-dir = "{cargo-cache-home}/build/allodia-mail-calendar"

# ---------------------------------------------------------------------------------------------
# Windows: link the C runtime statically.
#
# MSVC links it dynamically by default, so mailcal_bindings.dll imports VCRUNTIME140.dll. That
# ships in the Visual C++ Redistributable, not in Windows, and our MSIX graph never pulls it in:
# Microsoft.WindowsAppRuntime.2 declares no dependencies, so Microsoft.VCLibs.140.00.UWPDesktop
# (which does carry it) never arrives. Microsoft links Microsoft.UI.Xaml.dll's own CRT statically
# for the same reason. On a clean machine LoadLibrary fails with ERROR_MOD_NOT_FOUND, the first
# P/Invoke throws DllNotFoundException inside App.OnLaunched, and WinUI fail-fasts with 0xc000027b
# (STATUS_STOWED_EXCEPTION); that is how 1.0.0.0 failed Store certification.
#
# The two MSVC triples only: `+crt-static` is wrong for Apple and Android, which link libc
# dynamically by contract. `cc` reads it back out of the target features, so libsqlite3-sys and
# ring compile /MT too.
#
# ⚠️ A RUSTFLAGS environment variable suppresses `target.*.rustflags` outright, silently undoing
# all of this; clients/windows/rust-crt.ps1 asserts on the built artifact to catch that.
# ---------------------------------------------------------------------------------------------

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# ---------------------------------------------------------------------------------------------
# Engine path override (simultaneous engine + core development).
#
# This file is tracked, so the override goes OUTSIDE the repo. Cargo merges config from every
# ancestor directory: create `<the directory holding this checkout>/.cargo/config.toml` with
#
#     [patch."https://github.com/allodia-eu/email-calendar-sync-engine"]
#     engine-api = { path = "email-calendar-sync-engine/crates/engine-api" }
#     engine-core = { path = "email-calendar-sync-engine/crates/engine-core" }
#     engine-provider = { path = "email-calendar-sync-engine/crates/engine-provider" }
#     engine-tls = { path = "email-calendar-sync-engine/crates/engine-tls" }
#     provider-imap = { path = "email-calendar-sync-engine/crates/provider-imap" }
#     provider-caldav = { path = "email-calendar-sync-engine/crates/provider-caldav" }
#     provider-graph = { path = "email-calendar-sync-engine/crates/provider-graph" }
#     provider-jmap = { path = "email-calendar-sync-engine/crates/provider-jmap" }
#
# Paths resolve relative to the config file declaring them, so those point at an engine checkout
# sitting beside this one. Delete the file to go back to the git-pinned commit in Cargo.toml.
# ($CARGO_HOME/config.toml works too, but applies to every workspace on the machine.)
#
# Use `[patch]`, never `paths = [...]`: a `paths` override may not change a crate's dependency
# list, so it hits a confusing resolver conflict the moment the local engine's dependencies differ
# from the pinned commit's, which is exactly what this override is for. Cargo warns `paths` will
# become a hard error.
# ---------------------------------------------------------------------------------------------
